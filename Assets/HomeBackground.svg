<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1920 1080"
    preserveAspectRatio="xMidYMid slice"
>

<defs>

    <!-- ================= BACKGROUND ================= -->

    <radialGradient id="background">
        <stop offset="0%" stop-color="#090914"/>
        <stop offset="55%" stop-color="#03030a"/>
        <stop offset="100%" stop-color="#000006"/>
    </radialGradient>


    <!-- ================= BLUE GLOW ================= -->

    <radialGradient id="blueGlow">
        <stop offset="0%" stop-color="#008cff" stop-opacity=".25">
            <animate
                attributeName="stop-opacity"
                values=".15;.32;.15"
                dur="6s"
                repeatCount="indefinite"
            />
        </stop>

        <stop offset="100%" stop-color="#008cff" stop-opacity="0"/>
    </radialGradient>


    <!-- ================= RED GLOW ================= -->

    <radialGradient id="redGlow">
        <stop offset="0%" stop-color="#ff003c" stop-opacity=".25">
            <animate
                attributeName="stop-opacity"
                values=".15;.32;.15"
                dur="7s"
                begin="2s"
                repeatCount="indefinite"
            />
        </stop>

        <stop offset="100%" stop-color="#ff003c" stop-opacity="0"/>
    </radialGradient>


    <!-- ================= MOVING LINE GRADIENT ================= -->

    <linearGradient id="movingGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">

        <stop offset="0%" stop-color="#0066ff"/>

        <stop offset="35%" stop-color="#00c8ff"/>

        <stop offset="65%" stop-color="#9b00ff"/>

        <stop offset="100%" stop-color="#ff003c"/>

        <!-- Slowly shift the gradient itself -->
        <animate
            attributeName="x1"
            values="0%;100%;0%"
            dur="8s"
            repeatCount="indefinite"
        />

        <animate
            attributeName="x2"
            values="100%;200%;100%"
            dur="8s"
            repeatCount="indefinite"
        />

    </linearGradient>


    <!-- ================= NEON FILTER ================= -->

    <filter id="neon">

        <feGaussianBlur
            stdDeviation="7"
            result="blur"
        />

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>


    <!-- Stronger NC glow -->

    <filter id="ncGlow">

        <feGaussianBlur
            stdDeviation="10"
            result="blur"
        />

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>


</defs>


<!-- ================================================= -->
<!-- STATIC BACKGROUND -->
<!-- ================================================= -->

<rect
    width="1920"
    height="1080"
    fill="url(#background)"
/>


<!-- ================================================= -->
<!-- ATMOSPHERIC LIGHT -->
<!-- ================================================= -->

<ellipse
    cx="280"
    cy="470"
    rx="600"
    ry="500"
    fill="url(#blueGlow)"
/>

<ellipse
    cx="1640"
    cy="470"
    rx="600"
    ry="500"
    fill="url(#redGlow)"
/>


<!-- ================================================= -->
<!-- SUBTLE GRID -->
<!-- ================================================= -->

<g
    stroke="#15152a"
    stroke-width="1"
    opacity=".25"
>

    <path d="M0 180 H1920"/>
    <path d="M0 360 H1920"/>
    <path d="M0 540 H1920"/>
    <path d="M0 720 H1920"/>
    <path d="M0 900 H1920"/>

    <path d="M240 0 V1080"/>
    <path d="M480 0 V1080"/>
    <path d="M720 0 V1080"/>
    <path d="M960 0 V1080"/>
    <path d="M1200 0 V1080"/>
    <path d="M1440 0 V1080"/>
    <path d="M1680 0 V1080"/>

</g>


<!-- ================================================= -->
<!-- MOVING NEON LINE 1 -->
<!-- ================================================= -->

<path
    d="M-200 700
       C200 480 430 900 760 650
       S1300 430 2120 650"

    fill="none"

    stroke="url(#movingGradient)"

    stroke-width="3"

    stroke-linecap="round"

    stroke-dasharray="35 120"

    filter="url(#neon)"

    opacity=".8"
>

    <!-- LINE MOVEMENT -->

    <animate
        attributeName="stroke-dashoffset"
        from="0"
        to="-155"
        dur="5s"
        repeatCount="indefinite"
    />

    <!-- brightness breathing -->

    <animate
        attributeName="opacity"
        values=".35;.9;.35"
        dur="5s"
        repeatCount="indefinite"
    />

</path>


<!-- ================================================= -->
<!-- MOVING NEON LINE 2 -->
<!-- ================================================= -->

<path
    d="M-200 820
       C250 610 480 1000 820 760
       S1350 540 2120 760"

    fill="none"

    stroke="url(#movingGradient)"

    stroke-width="2"

    stroke-linecap="round"

    stroke-dasharray="18 160"

    filter="url(#neon)"

    opacity=".55"
>

    <animate
        attributeName="stroke-dashoffset"
        from="0"
        to="-178"
        dur="8s"
        repeatCount="indefinite"
    />

    <animate
        attributeName="opacity"
        values=".2;.7;.2"
        dur="7s"
        repeatCount="indefinite"
    />

</path>


<!-- ================================================= -->
<!-- MOVING TOP LINE -->
<!-- ================================================= -->

<path
    d="M-100 260
       C300 120 500 370 820 250
       S1400 120 2020 300"

    fill="none"

    stroke="url(#movingGradient)"

    stroke-width="2"

    stroke-linecap="round"

    stroke-dasharray="12 130"

    filter="url(#neon)"

    opacity=".45"
>

    <animate
        attributeName="stroke-dashoffset"
        from="0"
        to="142"
        dur="9s"
        repeatCount="indefinite"
    />

</path>


<!-- ================================================= -->
<!-- LEFT DIAGONAL NEON -->
<!-- ================================================= -->

<path
    d="M0 150 L420 520"

    fill="none"

    stroke="url(#movingGradient)"

    stroke-width="3"

    stroke-linecap="round"

    stroke-dasharray="10 100"

    filter="url(#neon)"

    opacity=".5"
>

    <animate
        attributeName="stroke-dashoffset"
        from="0"
        to="-110"
        dur="6s"
        repeatCount="indefinite"
    />

</path>


<!-- ================================================= -->
<!-- RIGHT DIAGONAL NEON -->
<!-- ================================================= -->

<path
    d="M1920 150 L1500 520"

    fill="none"

    stroke="url(#movingGradient)"

    stroke-width="3"

    stroke-linecap="round"

    stroke-dasharray="10 100"

    filter="url(#neon)"

    opacity=".5"
>

    <animate
        attributeName="stroke-dashoffset"
        from="0"
        to="110"
        dur="6s"
        repeatCount="indefinite"
    />

</path>




<!-- ================================================= -->
<!-- SMALL CENTER HORIZONTAL LIGHT -->
<!-- ================================================= -->

<line
    x1="650"
    y1="650"
    x2="1270"
    y2="650"

    stroke="url(#movingGradient)"

    stroke-width="2"

    filter="url(#neon)"

    opacity=".5"
>

    <animate
        attributeName="opacity"
        values=".2;.7;.2"
        dur="6s"
        repeatCount="indefinite"
    />

</line>


<!-- ================================================= -->
<!-- FLOATING LIGHT POINTS -->
<!-- ================================================= -->

<g>

    <circle
        cx="300"
        cy="300"
        r="3"
        fill="#008cff"
    >
        <animate
            attributeName="opacity"
            values=".1;1;.1"
            dur="3s"
            repeatCount="indefinite"
        />
    </circle>


    <circle
        cx="520"
        cy="780"
        r="3"
        fill="#ff174f"
    >
        <animate
            attributeName="opacity"
            values=".1;1;.1"
            dur="4s"
            begin="1s"
            repeatCount="indefinite"
        />
    </circle>


    <circle
        cx="1400"
        cy="280"
        r="3"
        fill="#00aaff"
    >
        <animate
            attributeName="opacity"
            values=".1;1;.1"
            dur="3.5s"
            begin=".5s"
            repeatCount="indefinite"
        />
    </circle>


    <circle
        cx="1650"
        cy="720"
        r="3"
        fill="#ff174f"
    >
        <animate
            attributeName="opacity"
            values=".1;1;.1"
            dur="4.5s"
            begin="1.5s"
            repeatCount="indefinite"
        />
    </circle>

</g>

</svg>